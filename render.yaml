# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan: the disk is ephemeral and the service sleeps after 15 idle minutes.
services:
  - type: web
    name: tendershield
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TS_EXTRACTOR
        value: pattern
